<script>bouwTekstPagina("over-ons.html", "Over ons", "De Over ons-pagina.", [{"titel": "Titel", "velden": [["over_titel", "Paginatitel", "Over JEL Openstage", "text", null]]}, {"titel": "Stuk 1", "velden": [["over_h1", "Kop", "Hoe het begon", "text", null], ["over_p1", "Tekst", "Eind 2024 werd er gezocht naar mensen die iets van showtechniek afwisten voor de schoolmusical. Stefan Prijs en Huub Boekhorst (toen in v4) waren al langer actief bij de sectie muziek met optredens. Uit interesse voor de techniek die daar achter schuilt rolden zij erin. Ongeveer een half jaar later ontstond het idee om alle nieuw gekochte apparatuur te gebruiken. Hoe kan dat beter dan met een concert dat voor iedereen toegankelijk is? Hieruit is de JEL Openstage geboren.", "area", null]]}, {"titel": "Stuk 2", "velden": [["over_h2", "Kop", "De eerste editie", "text", null], ["over_p2", "Tekst", "De eerste editie was een groot succes! Vele optredens van leerlingen en docenten maakten dit tot een gezellige avond. Er werd van alles gespeeld van Roxy Dekker tot Bon Jovi, en flitsende lichtshows tot knallende gitaren maakten het tot een echt concert. Ook heeft de organisatie veel geleerd deze avond — niet alles ging even goed. Deze lessen heeft de organisatie meegenomen naar de tweede editie zodat het een nog groter succes kan worden!", "area", null]]}, {"titel": "Stuk 3", "velden": [["over_h3", "Kop", "De tweede editie", "text", null], ["over_p3", "Tekst", "De tweede editie was weer een groot succes nu vooral leerlingen op het podium! We hopen dat JEL Openstage weer zo'n succes wordt!", "area", null]]}, {"titel": "Stuk 4", "velden": [["over_h4", "Kop", "Plannen voor de toekomst", "text", null], ["over_p4", "Tekst", "We hopen heel graag nog heel vaak JEL Openstage te mogen organiseren zodat iedereen een podium krijgt!", "area", null]]}]);</script></body></html>
